name: Test, build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - name: Verify committed FTP app is up to date
        run: git diff --exit-code -- web/
      - uses: actions/upload-artifact@v4
        with:
          name: arc-web
          path: |
            dist/arc.html
            dist/teile.html
            dist/arc-xp.html
            dist/arc-xp.hta
            dist/arc-xp.zip
      - run: docker build -t arc:ci .
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: arc-web
          path: dist
      - name: Publish standalone app
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/arc.html dist/teile.html dist/arc-xp.zip --verify-tag --generate-notes --title "Arc $RELEASE_TAG"
